{% load i18n %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% trans "Password Reset" %} · Sudanile Kitchen Admin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #0b0a08; padding: 1.5rem;
      background-image: radial-gradient(circle at 20% 30%, rgba(255, 120, 0, 0.04) 0%, transparent 40%),
                        radial-gradient(circle at 80% 70%, rgba(255, 120, 0, 0.06) 0%, transparent 50%);
    }
    .reset-card {
      max-width: 520px; width: 100%; background: #141210;
      border-radius: 2rem; padding: 2.5rem; text-align: center;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 120, 0, 0.15);
      color: #ece6df;
    }
    .status-icon { width: 64px; height: 64px; margin: 0 auto 1.2rem; border-radius: 20px; background: rgba(76, 217, 130, 0.14); display: flex; align-items: center; justify-content: center; }
    .status-icon i { font-size: 1.9rem; color: #4cd97e; }
    h2 { font-size: 1.5rem; font-weight: 500; color: #f2ece6; margin-bottom: 0.8rem; }
    .text { font-size: 0.95rem; color: #8f7e6e; line-height: 1.6; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px; margin-top: 1.6rem;
      background: #ff7b00; color: #0f0d0b; text-decoration: none; padding: 0.85rem 2rem; border-radius: 60px;
      font-weight: 600; font-size: 1rem; transition: 0.2s; box-shadow: 0 6px 20px rgba(255, 123, 0, 0.25);
    }
    .btn:hover { background: #ff8c1a; }
  </style>
</head>
<body>
  <div class="reset-card">
    <div class="status-icon"><i class="fas fa-check-circle"></i></div>
    <h2>{% trans "Password changed" %}</h2>
    <p class="text">
      {% trans "Your password has been reset successfully. You can now sign in with your new password." %}
    </p>
    <a class="btn" href="{% url 'home' %}"><i class="fas fa-arrow-right"></i> {% trans "Go to login" %}</a>
  </div>
</body>
</html>
